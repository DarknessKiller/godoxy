name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: "recursive"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Build godoxy
        run: go build -ldflags=-checklinkname=0 -o godoxy ./cmd

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godoxy-linux-amd64
          path: godoxy
          if-no-files-found: error

  meta:
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.owner.outputs.value }}
    steps:
      - name: Lowercase repository owner
        id: owner
        # ghcr rejects uppercase owners.
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  docker:
    needs: meta
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image_name: ${{ needs.meta.outputs.image_owner }}/godoxy
      tag: latest
      target: main
